name: glam_ai
description: "Glam AI - Fashion AI App for outfit generation and price comparison"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # AI Integration
  google_generative_ai: ^0.4.6
  
  # Camera & Image
  camera: ^0.11.0+2
  image_picker: ^1.0.7
  image: ^4.1.7
  
  # Environment variables
  flutter_dotenv: ^5.1.0
  
  # State management
  provider: ^6.1.1
  
  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  
  assets:
    - .env
